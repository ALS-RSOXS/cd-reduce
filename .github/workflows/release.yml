# Release: when a push to main changes the package and the version in pyproject.toml
# has no git tag yet, run CI, build the wheel and sdist, publish to PyPI (trusted
# publishing), then create the tag `vX.Y.Z` and a GitHub release with git-cliff notes.
#
# To release: bump `version` in pyproject.toml AND `__version__` in
# src/cd_reduce/__init__.py in a normal PR and merge it. `make release-check` shows
# what would happen. Use "Run workflow" with dry_run to build without publishing.
name: Release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - src/**
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything but do not publish or tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: decide whether to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: python3 scripts/release_check.py --github-output "$GITHUB_OUTPUT"

  ci:
    name: tests
    needs: check
    if: needs.check.outputs.release == 'true' || inputs.dry_run
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: build wheel and sdist
    needs: [check, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv build
      - name: smoke-test the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import cd_reduce, sys; v = cd_reduce.__version__; assert v == '${{ needs.check.outputs.version }}', v; print('cd_reduce', v)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: [check, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cd-reduce
    permissions:
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: tag and GitHub release
    needs: [check, publish-pypi]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ needs.check.outputs.version }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file RELEASE_NOTES.md
